name: Deploy (Demo)

# 社内AI勉強会デモ用のワークフローです（docs/demo/scenario.md 参照）。
# ビルドとログ出力のみ行い、実際のデプロイ・本番反映は一切行いません。

on:
  push:
    branches:
      - main
    paths:
      - 'front/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front/package-lock.json

      - run: npm ci

      - run: npm run build

      - name: Deploy (simulated)
        run: |
          echo "Deploying front/dist to production..."
          echo "(This is a demo step for the internal AI workshop. No real deployment happens.)"
          echo "Deploy complete."
