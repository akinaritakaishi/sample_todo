name: Lint

on:
  pull_request:
    paths:
      - 'todo-app/**'
      - '.github/workflows/lint.yml'

jobs:
  eslint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: todo-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: todo-app/package-lock.json

      - run: npm ci

      - run: npm run lint
