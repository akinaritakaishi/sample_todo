name: Lint

on:
  pull_request:
    paths:
      - 'front/**'
      - '.github/workflows/lint.yml'

jobs:
  eslint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front/package-lock.json

      - run: npm ci

      - run: npm run lint
